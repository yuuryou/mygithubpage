      const CONTENT_EN = {"meta":{"title":"Language in Society — An Introduction to Sociolinguistics (Romaine, 2000)","author":"Suzanne Romaine","edition":"2000","source":"Oxford University Press"},"themes":[{"id":"language-identity-community","title":"Language, Identity & Community","sections":[{"id":"speech-communities","title":"Speech Communities & Communicative Competence","summary":"Defines speech communities as networks united by shared norms for language use. Emphasizes competence as knowledge of rules for appropriate speech in contexts, not only grammar.","keyPoints":["Speech communities are defined by shared evaluative norms, not by a single uniform grammar.","Competence includes knowing when/where/how to speak (pragmatics).","Boundaries are porous; communities overlap and shift across domains (home, work, school)."],"examples":["A bilingual neighborhood uses Spanish at home and English at institutions; norms govern switching.","In a workplace, jargon and politeness routines define membership more than birthplace."],"quotes":[{"text":"What unites a community is agreement about norms for language use rather than uniform usage.","cite":"Romaine, 2000, ch.1"}],"glossary":[{"term":"Speech community","def":"A group sharing norms for interpreting and evaluating language use."},{"term":"Communicative competence","def":"Knowledge of how to use language appropriately across contexts."}],"figures":[{"type":"table","title":"Domains of Language Use","caption":"Illustrative mapping of domains to codes in a bilingual community.","headers":["Domain","Typical Code","Notes"],"rows":[["Home","Spanish","Solidarity, intimacy"],["School","English","Institutional norms"],["Market","Both","Choice by interlocutor"],["Religious","Spanish","Group identity"]]}]},{"id":"register-style","title":"Register, Style, Accommodation","summary":"Registers are situational varieties; style is the speaker's selection within constraints. Audience design and accommodation explain how we converge or diverge linguistically.","keyPoints":["Register aligns with activity type (e.g., legalese).","Style shifts with topic, audience, and stance.","Accommodation: speakers adapt toward or away from interlocutors to manage social distance."],"examples":["Shifting from casual to careful speech during a job interview.","Using more technical terms when presenting to specialists."],"quotes":[],"glossary":[{"term":"Register","def":"Variety associated with a situation or activity type."},{"term":"Style","def":"Choice of features indexing formality, stance, or audience."},{"term":"Accommodation","def":"Adjusting speech toward/away from interlocutors."}],"figures":[]}]},{"id":"language-choice","title":"Multilingualism & Language Choice","sections":[{"id":"diglossia","title":"Diglossia & Domains","summary":"Explains complementary distribution of High (H) and Low (L) varieties across domains; stability depends on clear functional separation and institutional support.","keyPoints":["H-varieties linked to literacy, religion, administration; L-varieties to home and intimacy.","Stability erodes when L encroaches into H domains via education/media.","Shift occurs when economic mobility favors one code across more domains."],"examples":["Arabic (Classical/Modern Standard vs. colloquial dialects).","Swiss German (Standard German for writing; Swiss German in everyday speech)."],"quotes":[{"text":"Functional compartmentalization underpins diglossic stability.","cite":"Romaine, 2000, ch.2"}],"glossary":[{"term":"Diglossia","def":"Stable co-existence of H and L varieties with functional separation."},{"term":"Domain","def":"A sphere of activity governing code choice (e.g., home, school)."}],"figures":[{"type":"table","title":"Idealized Diglossic Allocation","headers":["Domain","Preferred Variety","Rationale"],"rows":[["Government","H","Formality, prestige"],["Education","H → L/H","Shifts with policy and pedagogy"],["Home","L","Solidarity"],["Media","H/L","Format, audience"]]}]},{"id":"code-switching","title":"Code-Switching & Code-Mixing","summary":"Distinguishes situational switching (context-driven) from metaphorical switching (meaning-making). Notes structural constraints and discourse functions (quotation, emphasis, identity).","keyPoints":["Switching indexes stance, alignment, topic shift, or addressee change.","Not random: follows grammatical constraints at switch points.","Stereotypes of deficiency obscure its communicative sophistication."],"examples":["Tag-switching in Cantonese–English youth talk for humor/emphasis.","Spanish–English switches to mark quoted speech or topic boundaries."],"quotes":[],"glossary":[{"term":"Code-switching","def":"Alternating languages/varieties across sentences or clauses."},{"term":"Code-mixing","def":"Intra-sentential mixing of elements from multiple codes."}],"figures":[]},{"id":"language-shift","title":"Language Maintenance, Shift & Death","summary":"Examines community-level outcomes when domains contract (shift) or persist (maintenance). Identifies economic incentives, intermarriage, schooling, and policy as drivers.","keyPoints":["Intergenerational transmission is decisive.","Shift is domain-by-domain before competence loss.","Revitalization aligns new functions with valued identities (schools, media, ritual)."],"examples":["Irish across schooling vs. home transmission patterns.","Indigenous languages facing domain squeeze in urban migration."],"quotes":[],"glossary":[{"term":"Maintenance","def":"Sustaining community bilingualism across domains."},{"term":"Shift","def":"Progressive replacement of one language by another."}],"figures":[]}]} ,{"id":"sociolinguistic-patterns","title":"Sociolinguistic Patterns","sections":[{"id":"variation","title":"Variation, Style, and Social Stratification","summary":"Presents quantitative correlations between linguistic variables and social class, style, and networks. Careful vs casual styles show hypercorrection patterns under prestige pressure.","keyPoints":["Variables correlate probabilistically with class and style (not categorical).","Attention to speech increases prestige variants in middle classes (hypercorrection).","Dense multiplex networks stabilize local norms and resist change."],"examples":["/r/-pronunciation across NYC department stores (prestige pattern).","t/d deletion in English conditioned by phonology and style."],"quotes":[],"glossary":[{"term":"Sociolinguistic variable","def":"A feature with socially patterned variants (e.g., -ing)."},{"term":"Hypercorrection","def":"Over-application of prestige form in careful speech."},{"term":"Network density","def":"Extent of interconnected ties among speakers."}],"figures":[{"type":"table","title":"Stylistic Shift and Prestige Variant (schematic)","headers":["Style","% prestige variant (illustrative)","Notes"],"rows":[["Casual","35%","Baseline community norm"],["Careful","55%","Attention to speech"],["Reading list","70%","Overt prestige salience"]]}]},{"id":"age-gender-class","title":"Age, Gender, and Class","summary":"Addresses apparent-time patterns (age-grading vs change in progress), gendered participation in change (often female-led for prestige or innovative norms), and class-indexed style.","keyPoints":["Adolescents often peak in use of local innovations.","Women may lead change from above (prestige) or below (covert prestige), depending on networks.","Class stratification interacts with local ideologies of correctness."],"examples":["Raising of vowels in regional English led by young women.","Covert prestige in working-class male speech for solidarity."],"quotes":[],"glossary":[{"term":"Apparent time","def":"Using generational differences to infer change in progress."},{"term":"Covert prestige","def":"Valuing nonstandard forms for solidarity/identity."}],"figures":[]}]} ,{"id":"language-gender","title":"Language & Gender","sections":[{"id":"gender-difference-dominance","title":"Difference, Dominance, and Discursive Practice","summary":"Surveys models of gendered langua               const kpH = document.createElement('div'); kpH.className = 'r-h3'; kpH.style.fontSize = '16px'; kpH.textContent = 'Key Points'; sdiv.appendChild(kpH);
              const ul = document.createElement('ul'); s.keyPoints.forEach(k => { const li = document.createElement('li'); li.textContent = k; ul.appendChild(li); }); sdiv.appendChild(ul);

            if (s.examples && s.examples.length) {

              const ul = document.createElement('ul'); s.examples.forEach(k => { const li = document.createElement('li'); li.textContent = k; ul.appendChild(li); }); sdiv.appendChild(ul);
            }
            if (s.figures && s.figures.length) {
              s.figures.forEach(f => {
                if (f.type === 'table') {
                  const ft = document.createElement('div'); ft.className = 'r-h3'; ft.style.fontSize = '16px'; ft.textContent = f.title; sdiv.appendChild(ft);
                  const wrapper = document.createElement('div'); wrapper.className = 'r-card'; wrapper.style.padding = '0';
                  const table = document.createElement('table');
                  const thead = document.createElement('thead'); const trh = document.createElement('tr');

              const ul = document.createElement('ul');
              s.quotes.forEach(qt => { const li = document.createElement('li'); const span = document.createElement('span'); span.className = 'r-quote'; span.textContent = '“' + qt.text + '” '; const btn = document.createElement('button'); btn.className = 'r-btn'; btn.textContent = 'APA'; btn.onclick = () => alert('Romaine, S. (2000). Italic: Language in society: An introduction to sociolinguistics. Oxford: Oxford University Press.\n\n(' + qt.cite + ')'); li.appendChild(span); li.appendChild(btn); ul.appendChild(li); });

          });
          themesDiv.appendChild(secWrap);
        });
        buildTOC();
      }

      function buildTOC() {
        const heads = qa('[data-section-title]');
        if (!heads.length) { miniTOC.style.display = 'none'; return; }
        miniTOC.style.display = 'block';
        miniTOC.innerHTML = `<div class="r-h3" style="margin-top:0;">${I18N[LANG].onThisPage}</div>`;
        heads.forEach(h => { const id = h.id || (h.id = 'h-' + Math.random().toString(36).slice(2)); const a = document.createElement('a'); a.href = '#' + id; a.textContent = h.textContent; miniTOC.appendChild(a); });
      }

      function renderRefs() { refsDiv.innerHTML = ''; CONTENT.references.forEach(r => { const div = document.createElement('div'); div.textContent = r.apa; refsDiv.appendChild(div); }); }

      function filterContent(qstr) {
        if (!qstr.trim()) return CONTENT.themes;
        qstr = qstr.toLowerCase(); const out = [];
        CONTENT.themes.forEach(th => { const sections = th.sections.filter(s => { const hay = [s.title, s.summary, ...(s.keyPoints||[]), ...(s.examples||[]), ...((s.glossary||[]).map(g=>g.term + ' ' + g.def))].join(' \n ').toLowerCase(); return hay.includes(qstr); }); if (sections.length) out.push(Object.assign({}, th, {sections})); });
        return out;
      }

      function switchLang() { LANG = LANG === 'en' ? 'zhHant' : LANG === 'zhHant' ? 'zhHans' : 'en'; langBtn.textContent = I18N[LANG].language + ': ' + (LANG==='en'?'EN':LANG==='zhHant'?'繁':'简'); applyHeader(); renderThemesGrid(); renderSections(); }
      function toggleMotion() { REDUCE = !REDUCE; motionBtn.textContent = I18N[LANG].reduceMotion + (REDUCE ? ' ✓' : ''); }

      function onScroll() {
        const st = root.scrollTop; const dh = root.scrollHeight - root.clientHeight; const pctNum = dh > 0 ? (st / dh) * 100 : 0;
        barInner.style.width = pctNum.toFixed(0) + '%'; pct.textContent = pctNum.toFixed(0) + '%';
        const heads = qa('[data-section-title]'); let cur = 'Start'; for (const h of heads) { const r = h.getBoundingClientRect(); const hostTop = root.getBoundingClientRect().top; if ((r.top - hostTop) <= 120) cur = h.textContent; } progressTitle.textContent = cur;
      }

      // Attach scroll listener to the section to avoid page-level conflicts
      root.addEventListener('scroll', onScroll, { passive: true });

      // Fluid background (slow 0.05 speed equivalent)
      (function fluidBG(){
        const canvas = q('#r-bg'); const ctx = canvas.getContext('2d');
        const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        const balls = new Array(12).fill(0).map(_ => ({ x: Math.random(), y: Math.random(), r: 80 + Math.random()*140, vx: (Math.random()*0.3 + 0.05) * (Math.random()<0.5?-1:1), vy: (Math.random()*0.3 + 0.05) * (Math.random()<0.5?-1:1), hue: Math.floor(Math.random()*360) }));
        function resize(){ const rect = root.getBoundingClientRect(); canvas.width = Math.floor(rect.width * DPR); canvas.height = Math.floor(rect.height * DPR); }
        function step(){ const W = canvas.width, H = canvas.height; ctx.clearRect(0,0,W,H); ctx.globalCompositeOperation = 'lighter'; const speed = 0.05 * (REDUCE ? 0.5 : 1) * 0.01; balls.forEach(b=>{ b.x += b.vx * speed; b.y += b.vy * speed; if (b.x < 0 || b.x > 1) b.vx *= -1; if (b.y < 0 || b.y > 1) b.vy *= -1; const cx = b.x * W, cy = b.y * H; const g = ctx.createRadialGradient(cx, cy, b.r*0.1, cx, cy, b.r); g.addColorStop(0, `hsla(${b.hue}, 90%, 60%, .9)`); g.addColorStop(1, `hsla(${(b.hue+40)%360}, 80%, 50%, 0)`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, b.r, 0, Math.PI*2); ctx.fill(); }); requestAnimationFrame(step); }
        function init(){ resize(); step(); }
        window.addEventListener('resize', resize); init();
      })();

      // Init render
      function fullRender(){ applyHeader(); renderThemesGrid(); renderSections(); renderRefs(); }
      fullRender();
      langBtn.onclick = switchLang; motionBtn.onclick = toggleMotion;
      search.addEventListener('input', (e)=>{ const filtered = filterContent(e.target.value); CONTENT = { ...CONTENT, themes: CONTENT_EN.themes }; // ensure reset
        if (!e.target.value.trim()) { CONTENT = CONTENT_EN; renderSections(); return; } const tmp = { ...CONTENT_EN, themes: filterContent(e.target.value) }; CONTENT = tmp; renderSections(CONTENT.themes); });

      // If the builder changes block height, keep canvas in sync
      const ro = new ResizeObserver(()=>{ const canvas = q('#r-bg'); const rect = root.getBoundingClientRect(); const DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1)); canvas.width = Math.floor(rect.width * DPR); canvas.height = Math.floor(rect.height * DPR); });
      ro.observe(root);
    })();
  </script>
