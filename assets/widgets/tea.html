<!doctype html><html><head><meta charset="utf-8"></head><body><script>window.onmessage = function(event) {event.source.postMessage({iframeId: event.data, scrollHeight: document.body.getBoundingClientRect().height || document.body.scrollHeight}, event.origin);};</script><body style='margin: 0'><!-- ==== Tea Preferences Radar (Fancy Glass UI, theme-matched) ==== -->
<div id="tea-radar-wrap" data-theme="light">
  <style>
    :root {
      --bg1: radial-gradient(1200px 800px at 10% 10%,
                rgba(255,255,255,0.9), rgba(240,245,255,0.6), rgba(230,235,245,0.5));
      --bg2: radial-gradient(1200px 800px at 90% 90%,
                rgba(220,240,255,0.35), rgba(210,220,235,0.25), transparent 70%);
      --card-bg: rgba(255,255,255,0.55);
      --card-stroke: rgba(255,255,255,0.8);
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --accent-2: #14b8a6;
      --grid: rgba(15, 23, 42, 0.08);
    }
    #tea-radar-wrap[data-theme="dark"] {
      --bg1: radial-gradient(1200px 800px at 10% 10%,
                rgba(30,35,45,0.9), rgba(20,25,35,0.7), rgba(10,12,18,0.65));
      --bg2: radial-gradient(1200px 800px at 90% 90%,
                rgba(56,189,248,0.18), rgba(59,130,246,0.12), transparent 70%);
      --card-bg: rgba(17, 24, 39, 0.55);
      --card-stroke: rgba(203, 213, 225, 0.2);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --accent-2: #2dd4bf;
      --grid: rgba(226, 232, 240, 0.16);
    }

    #tea-radar-wrap {
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      color: var(--text);
      position: relative;
      padding: clamp(18px, 3vw, 28px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2)),
        var(--bg1), var(--bg2);
      backdrop-filter: saturate(140%) blur(3px);
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 10px 30px rgba(2, 6, 23, 0.15),
        inset 0 0 0 1px var(--card-stroke);
      max-width: 820px; margin: 0 auto;
    }

    .header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: clamp(14px,2vw,18px);
    }
    .title {
      font-size: clamp(20px, 3vw, 28px);
      font-weight: 800; letter-spacing: 0.2px;
      line-height: 1.1;
      display: flex; align-items: center; gap: 10px;
    }
    .controls { display: flex; align-items: center; gap: 10px; }
    .toggle {
      appearance: none; border: none; cursor: pointer; border-radius: 999px;
      padding: 8px 12px; font-weight: 700; color: white;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 6px 16px rgba(20, 184, 166, 0.35);
    }

    .card {
      position: relative;
      border-radius: 20px;
      background: var(--card-bg);
      box-shadow:
        0 8px 28px rgba(2, 6, 23, 0.18),
        inset 0 0 0 1px var(--card-stroke);
      overflow: hidden;
    }
    .card::after {
      content: "";
      position: absolute; inset: -2px;
      background: conic-gradient(from 180deg at 50% 50%,
                  transparent 0 40%,
                  rgba(99,102,241,0.28) 42%,
                  rgba(34,197,94,0.22) 55%,
                  transparent 65% 100%);
      filter: blur(22px); opacity: 0.55; pointer-events: none;
    }
    .card-head {
      padding: 14px 16px 8px 16px; display: flex; align-items: baseline; gap: 10px;
    }
    .card-title {
      font-weight: 800; letter-spacing: 0.2px; font-size: 18px;
    }
    .subtle {
      color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .canvas-wrap { padding: 8px 12px 16px 12px; height: 420px; }
    @media (max-width: 420px) { .canvas-wrap { height: 360px; } }
  </style>

  <div class="header">
    <div class="title">Tea Preferences</div>
    <div class="controls">
      <button id="teaThemeToggle" class="toggle" aria-label="Toggle theme">Toggle Theme</button>
    </div>
  </div>

  <section class="card" aria-label="Tea Radar Chart">
    <div class="card-head">
    </div>
    <div class="canvas-wrap">
      <canvas id="teaRadar"></canvas>
    </div>
  </section>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" integrity="sha384-JUh163oCRItcbPme8pYnROHQMC6fNKTBWtRG3I3I0erJkzNgL7uxKlNwcrcFKeqF" crossorigin="anonymous"></script>
<script>
  // Theme toggle
  const teaWrap = document.getElementById('tea-radar-wrap');
  document.getElementById('teaThemeToggle').addEventListener('click', () => {
    teaWrap.dataset.theme = teaWrap.dataset.theme === 'dark' ? 'light' : 'dark';
    // when theme changes, refresh grid/text colors
    updateChartTheme();
  });

  // Helpers
  function makeGradient(ctx, area, c1, c2) {
    const r = Math.min(area.right - area.left, area.bottom - area.top) / 2;
    const g = ctx.createRadialGradient(area.left + r, area.top + r, r*0.05, area.left + r, area.top + r, r);
    g.addColorStop(0, c1);
    g.addColorStop(1, c2);
    return g;
  }
  function css(varName){ return getComputedStyle(teaWrap).getPropertyValue(varName).trim(); }

  // Data (unchanged)
  const labels = ['Herbal tea','Flower tea','Green tea','Oolong tea','Black tea','Houjicha'];
  const values = [40, 95, 75, 50, 85, 95];

  // Chart
  const ctx = document.getElementById('teaRadar').getContext('2d');
  const teaChart = new Chart(ctx, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: 'Preference',
        data: values,
        borderWidth: 2,
        pointRadius: 3,
        pointHoverRadius: 5,
        borderColor: css('--accent'),
        pointBackgroundColor: css('--accent'),
        pointBorderColor: css('--accent'),
        backgroundColor: (c) => {
          const {ctx: c2, chartArea: a} = c.chart;
          if (!a) return 'rgba(37,99,235,0.18)'; // fallback
          return makeGradient(c2, a, 'rgba(37,99,235,0.24)', 'rgba(20,184,166,0.16)');
        },
        fill: true,
        tension: 0.2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        r: {
          min: 0, max: 100, beginAtZero: true,
          angleLines: { color: css('--grid') },
          grid:       { color: css('--grid') },
          ticks:      { stepSize: 20, showLabelBackdrop: false, color: css('--muted') },
          pointLabels:{ color: css('--text'), font: { weight: '700', size: 12 } }
        }
      },
      animation: { duration: 900, easing: 'easeOutQuart' }
    }
  });

  function updateChartTheme(){
    teaChart.options.scales.r.angleLines.color = css('--grid');
    teaChart.options.scales.r.grid.color       = css('--grid');
    teaChart.options.scales.r.ticks.color      = css('--muted');
    teaChart.options.scales.r.pointLabels.color= css('--text');
    teaChart.data.datasets[0].borderColor      = css('--accent');
    teaChart.data.datasets[0].pointBackgroundColor = css('--accent');
    teaChart.data.datasets[0].pointBorderColor = css('--accent');
    teaChart.update();
  }
</script>
<script>(function(){function wf(){var b=document.body;if(!b)return;var h=Math.max(b.scrollHeight,b.offsetHeight,document.documentElement?document.documentElement.scrollHeight:0);if(h>80&&window.parent!==window){try{parent.postMessage({type:"widget-height",name:"tea",h:h},"*");}catch(e){}}}
window.addEventListener("load",function(){setTimeout(wf,200);setTimeout(wf,900);setTimeout(wf,2200);});
window.addEventListener("resize",wf);})();</script></body></body></html>
